name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: 
      - main
      - 'cursor/walkie-talkie-gestures-*'
      - 'cursor/walkie-talkie-voice-client-*'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd NotchBuddy && xcodegen

      - name: Test screen geometry
        run: bash scripts/test-screen-geometry.sh

      - name: Test Claude hook detection
        run: bash scripts/test-claude-hooks.sh

      - name: Test display choice
        run: bash scripts/test-display-choice.sh

      - name: Desktop Mochi and gaze tests
        run: bash scripts/test-desktop-mochi.sh

      - name: Test auto-close timing
        run: bash scripts/test-auto-close.sh

      - name: Test open on hover
        run: bash scripts/test-island-hover.sh

      - name: Test terminal target
        run: bash scripts/test-terminal-target.sh

      - name: Test link filter
        run: bash scripts/test-safe-links.sh

      - name: Test Claude response text
        run: bash scripts/test-claude-response.sh

      - name: Test chat parsing
        run: bash scripts/test-chat-parsing.sh

      - name: Test plan gauge
        run: bash scripts/test-plan-gauge.sh

      - name: Test ask question
        run: bash scripts/test-ask-question.sh

      - name: Diff engine tests
        run: bash scripts/test-diff-engine.sh

      - name: GitHub pulse tests
        run: bash scripts/test-github-pulse.sh

      - name: GitHub activity tests
        run: bash scripts/test-github-activity.sh

      - name: Wardrobe tests
        run: bash scripts/test-wardrobe.sh

      - name: Walkie gesture tests
        run: bash scripts/test-walkie-gesture.sh

      - name: Pill colour tests
        run: bash scripts/test-pill-colors.sh

      - name: Claude settings file tests
        run: bash scripts/test-claude-settings.sh

      - name: Walkie-talkie state tests
        run: bash scripts/test-walkie-talkie-state.sh

      - name: Walkie-talkie protocol tests
        run: bash scripts/test-walkie-talkie-protocol.sh

      - name: Walkie-talkie WebKit bridge test
        timeout-minutes: 3
        run: bash scripts/test-webkit-bridge.sh

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Walkie-talkie E2E signaling test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/test-walkie-talkie-e2e.sh

      - name: Build
        run: |
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme NotchBuddy \
            -configuration Release \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build App Store target (unsigned)
        run: |
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme CoucouAppStore \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build iPhone link spike (Mac, DebugCloud, unsigned)
        run: |
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme NotchBuddyCloud \
            -configuration DebugCloud \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build iPhone link spike (Mac, ReleaseCloud, unsigned)
        run: |
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme NotchBuddy \
            -configuration ReleaseCloud \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build iPhone app (unsigned)
        run: |
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme CoucouPhone \
            -destination 'generic/platform=iOS' \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Build downloadable walkie-talkie test build
        run: |
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme NotchBuddy \
            -configuration Release \
            -derivedDataPath DerivedData \
            build

      - name: Ad-hoc codesign with mic entitlement
        run: |
          APP_PATH="DerivedData/Build/Products/Release/NotchBuddy.app"
          
          # Create temporary entitlements file
          cat > /tmp/entitlements.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.device.audio-input</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          # Ad-hoc sign with entitlements
          codesign --force --deep --sign - --entitlements /tmp/entitlements.plist "$APP_PATH"
          
          # Verify signature
          codesign --verify --deep --strict "$APP_PATH"

      - name: Zip app bundle
        run: |
          cd DerivedData/Build/Products/Release
          ditto -c -k --keepParent NotchBuddy.app NotchBuddy.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotchBuddy-walkie-test
          path: DerivedData/Build/Products/Release/NotchBuddy.zip

      - name: Create prerelease
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/cursor/walkie-talkie-voice-client-')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG_NAME="walkie-test-${SHORT_SHA}"
          
          # Create release notes
          cat > /tmp/release-notes.md <<EOF
          # Walkie-Talkie Test Build
          
          **⚠️ Unsigned App - First Launch Instructions:**
          1. Download \`NotchBuddy.zip\`
          2. Extract the app
          3. Right-click on NotchBuddy.app and select "Open"
          4. Click "Open" in the security dialog
          
          Built from commit ${GITHUB_SHA} on branch ${GITHUB_REF_NAME}
          
          This is an ad-hoc signed test build for walkie-talkie feature testing.
          EOF
          
          # Delete tag if it exists
          gh release delete "$TAG_NAME" --yes 2>/dev/null || true
          git push origin ":refs/tags/$TAG_NAME" 2>/dev/null || true
          
          # Create new prerelease
          gh release create "$TAG_NAME" \
            DerivedData/Build/Products/Release/NotchBuddy.zip \
            --title "Walkie Test ${SHORT_SHA}" \
            --notes-file /tmp/release-notes.md \
            --prerelease
